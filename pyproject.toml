[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-effects-lab"
version = "1.0.0"
description = "Reproducible numerical models for 18 corporate-finance and financial-markets effects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "matplotlib==3.10.3",
  "plotly==6.1.2",
  "openpyxl==3.1.5",
  "networkx==3.4.2",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "jupyterlab==4.4.3", "nbformat==5.10.4", "nbconvert==7.16.6"]

[project.scripts]
finance-effects = "finance_effects_lab.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
